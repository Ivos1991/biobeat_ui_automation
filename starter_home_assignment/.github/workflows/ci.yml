name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Test scope to execute"
        required: true
        default: "all"
        type: choice
        options:
          - ui
          - api
          - all
      evidence_mode:
        description: "Playwright evidence collection mode"
        required: true
        default: "on_failure"
        type: choice
        options:
          - on_failure
          - always

jobs:
  test-run:
    runs-on: ubuntu-latest
    env:
      BROWSER_EVIDENCE_MODE: ${{ inputs.evidence_mode || 'on_failure' }}
      RUN_TYPE: ${{ inputs.run_type || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Choose pytest target
        id: pytest_target
        shell: bash
        run: |
          case "${RUN_TYPE}" in
            ui)
              echo "target=tests/ui -m ui" >> "$GITHUB_OUTPUT"
              ;;
            api)
              echo "target=tests/api -m api" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "target=tests" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run selected suite
        shell: bash
        run: |
          python -m pytest ${{ steps.pytest_target.outputs.target }} -q -rs --alluredir artifacts/allure-results

      - name: Upload raw test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ env.RUN_TYPE }}
          if-no-files-found: warn
          path: artifacts/
