[project]
name = "starter-home-assignment"
version = "0.1.0"
description = "Generic Python pytest + Playwright starter for home assignments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.13.5",
    "playwright>=1.53.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.4.0",
    "pytest-playwright>=0.7.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "config*", "core*", "ui*"]
