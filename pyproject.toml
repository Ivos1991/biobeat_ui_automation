[project]
name = "biobeat-ui-automation"
version = "0.1.0"
description = "Pytest + Playwright UI automation foundation for the BioBeat Patient Admission assignment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.13.5",
    "playwright>=1.53.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.4.0",
    "pytest-playwright>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "core*", "flows*", "test_data*", "ui*", "utils*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["allure_pytest.utils"]
ignore_missing_imports = true
